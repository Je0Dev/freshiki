[package]
name = "freshiki"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
